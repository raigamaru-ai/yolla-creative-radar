# Yolla Creative Radar — настройки еженедельного анализа креативов конкурентов.
# Секреты (APIFY_TOKEN, GOOGLE_SERVICE_ACCOUNT_JSON) сюда НЕ кладём — только в переменные окружения.

window_days: 7            # анализируем предыдущие 7 дней до дня запуска (не включая сам день запуска)

google_drive:
  # ID папки внутри Shared Drive, куда складываются еженедельные отчёты.
  # Пример ссылки: https://drive.google.com/drive/folders/<ВОТ_ЭТОТ_ID>
  root_folder_id: "1xN5eceo76vN7RtzqPW6Vrmeq0boOdJ7y"

selection:
  download_top_overall: 30     # сколько лучших креативов за неделю скачивать
  download_top_per_competitor: 3  # плюс минимум столько от каждого конкурента (если есть)
  max_video_mb: 150
  frames_per_video: 6          # ключевые кадры для анализа Claude и как референсы
  transcribe_audio: true       # faster-whisper (если установлен); иначе пропускается

# Вес метрик в итоговом score (0..1). Если у креатива нет охвата — веса перенормируются.
scoring:
  reach: 0.45        # EU reach (Meta DSA) / unique users seen (TikTok)
  longevity: 0.35    # сколько дней креатив крутится: главный прокси «работает»
  variations: 0.20   # сколько копий/вариаций одного креатива запущено (collation count)

# Модуль 5: генерация креативов в Kling (официальный API, ключ — переменная окружения KLING_API_KEY).
kling:
  enabled: false            # выключено до покупки пакета Kling API; включить: true + KLING_API_KEY
  base_url: "https://api-singapore.klingai.com"
  aspect_ratios: ["9:16", "1:1", "16:9"]   # разрешённые форматы
  usd_per_unit: 0.14                        # для оценки стоимости в логе
  poll_seconds: 20
  timeout_minutes: 40
  video:
    endpoint: "/text-to-video/kling-3.0"
    resolution: "720p"
    min_duration: 3
    max_duration: 15          # секунд, не больше
    audio: "native"           # речь, войсовер и музыку генерирует Kling ("off" — без звука, в 1.5 раза дешевле)
    units_per_second: 0.6     # прайс Kling 3.0, 720p без звука (≈ $0.084/с)
    units_per_second_audio: 0.9
    max_per_run: 6            # не больше 6 видео за прогон
    max_units_per_run: 85     # потолок ≈ $12 за прогон: 6 роликов × 15 с со звуком
  image:
    endpoint: "/image-generation/kling-4.0"
    resolution: "2k"          # минимум у Image 4.0; скрипт делает копию 720p
    max_per_run: 6

competitors:
  # page_ids и tiktok.advertisers найдены командой `python -m radar probe` 27.11.2026 и проверены по текстам объявлений.
  # С ними поиск идёт строго по страницам конкурента (без чужих «Boss», «LIBON»-плитки и т.п.).
  # tiktok: {} — в TikTok Ad Library (EU) у конкурента нет аккаунта, TikTok не опрашиваем (каждый поиск ≈ 10 мин).
  - name: Boss Revolution
    facebook: { query: "Boss Revolution", page_ids: ["293019114195862"] }
    tiktok:   {}
    match: ["boss ?revolution", "idt"]                    # regex по имени рекламодателя: отсекает шум
  - name: Rebtel
    facebook: { query: "Rebtel", page_ids: ["14657950530"] }
    tiktok:   { query: "Rebtel", advertisers: [{ id: "7024075024436822785", name: "Rebtel Networks AB" }] }
    match: ["rebtel"]
  - name: Libon
    facebook: { query: "Libon", page_ids: ["483412228408184", "104295426271151", "109346051591075", "619076241451044"] }
    tiktok:   { query: "Libon", advertisers: [{ id: "7236399462971883522", name: "LIBON" }] }
    match: ["libon"]
  - name: CallTuv
    facebook: { query: "CallTuv", page_ids: ["861155367091001"] }
    tiktok:   {}
    match: ["call ?tuv"]
  # Africallshop и Talk360: на 27.11.2026 в Meta Ad Library за 90 дней нет ни одного их объявления
  # (у Talk360 только чужие «…360»), в TikTok (EU) аккаунтов нет. Поиск по фразе оставлен: появятся — попадут в отчёт.
  - name: Africallshop
    facebook: { query: "Africallshop", page_ids: [] }
    tiktok:   {}
    match: ["africallshop"]
  - name: Talk360
    facebook: { query: "Talk360", page_ids: [] }
    tiktok:   {}
    match: ["talk ?360"]

# Акторы Apify. Стоимость ограничена: только объявления, АКТИВНЫЕ (имевшие показы) в 7-дневном окне,
# включая запущенные раньше, отсортированные по показам, с жёстким лимитом на конкурента. Ориентир: FB ~$5 / 1000 объявлений, TikTok ~$1 / 1000.
# Шаблон подставляет {url}, {query}, {max_items}, {start_date}, {end_date}.
apify:
  facebook:
    actor: "apify/facebook-ads-scraper"
    max_items: 50            # топ-50 по показам на конкурента за неделю (≈ $0.25)
    # Если у конкурента заданы page_ids — ищем строго по его странице (дешевле и точнее).
    # Иначе — по точной фразе; чужие рекламодатели отсекаются по полю match.
    # ID страниц, найденные в выдаче, скрипт сохраняет в work/<дата>/discovered_page_ids.json.
    url_by_query: "https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=ALL&media_type=all&q={query}&search_type=keyword_exact_phrase&sort_data[mode]=total_impressions&sort_data[direction]=desc&start_date[min]={start_date}&start_date[max]={end_date}"
    url_by_page:  "https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=ALL&media_type=all&search_type=page&view_all_page_id={page_id}&sort_data[mode]=total_impressions&sort_data[direction]=desc&start_date[min]={start_date}&start_date[max]={end_date}"
    input:
      startUrls: [{ url: "{url}" }]
      resultsLimit: "{max_items}"
      isDetailsPerAd: false              # детали дорогие и почти всегда без охвата
      onlyTotal: false
  tiktok:
    # TikTok Ad Library показывает только объявления с показами в EU/EEA/UK (требование DSA).
    # Актор lexis-solutions (≈ $0.5 / 1000 объявлений). Прежний datascoutlab падал с «Unexpected end of JSON input».
    # advertiserName: актор сначала ищет рекламодателя с таким именем, иначе ищет по тексту объявлений.
    # Если у конкурента заданы tiktok.advertisers ([{id, name}] из вывода `python -m radar probe`), ищем строго по ним.
    actor: "lexis-solutions/tiktok-ads-scraper"
    max_items: 24            # на конкурента за прогон
    max_charge_usd: 0.5      # потолок оплаты одного запуска (актор платный по событиям: объявления + решение капчи)
    input:
      advertiserName: "{query}"
      country: "all"
      startDate: "{start_date}"
      endDate: "{end_date}"
      sortBy: "impression,desc"
      maxPages: 2
      proxyConfiguration: { useApifyProxy: true }
